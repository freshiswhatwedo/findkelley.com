<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soitskelley</title>
<meta name="description" content="soitskelley — developer · designer · caffeine enthusiast">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --accent: oklch(0.84 0.13 165); --accent-bright: oklch(0.86 0.14 165); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0d0e11;
    color: #c7c9d1;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    line-height: 1.4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(24px, 5vh, 80px) clamp(20px, 5vw, 40px);
    min-height: 100dvh;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .inner {
    max-width: 600px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2.5vh, 20px);
  }
  .path {
    font-size: clamp(11px, 2.5vw, 14px);
    color: rgba(110,114,126,.85);
    animation: fadeUp .4s .05s both;
  }
  .name {
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 700;
    letter-spacing: -.5px;
    color: #eceef4;
    animation: fadeUp .45s .15s both;
  }
  .name .dot { color: var(--accent); }
  .bio {
    font-size: clamp(12px, 3vw, 16px);
    color: rgba(140,144,156,.9);
    animation: fadeUp .4s .28s both;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.5vh, 4px);
    padding-top: clamp(24px, 4vh, 40px);
    border-top: 1px solid #22242b;
    animation: fadeUp .5s .42s both;
  }
  .lk {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(12px, 2vh, 16px) clamp(6px, 1.5vw, 8px);
    color: #c9cbd3;
    text-decoration: none;
    font-size: clamp(13px, 3.2vw, 16px);
    border-bottom: 1px solid #22242b;
    transition: color .15s, transform .15s;
    touch-action: manipulation;
  }
  .lk:hover { color: var(--accent-bright); transform: translateX(4px); }
  .lk .left { display: flex; align-items: baseline; gap: 11px; }
  .lk .num {
    color: rgba(100,104,116,.7);
    font-size: clamp(11px, 2.5vw, 13px);
  }
  .dot-end { display: block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: #eceef4; transition: background .15s; }
  .lk:hover .dot-end { background: var(--accent); }
  .foot {
    font-size: clamp(11px, 2.5vw, 13px);
    color: rgba(110,114,126,.8);
    padding-top: clamp(20px, 3.5vh, 32px);
    animation: fadeUp .4s .9s both;
  }
  .cursor { display: inline-block; width: 8px; height: 13px; background: var(--accent); transform: translateY(2px); animation: blink 1.1s steps(1) infinite; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
</style>
</head>
<body>
  <main class="inner">
      <div class="path">~ / soitskelley</div>
      <div class="name">soitskelley<span class="dot">.</span></div>

        <a class="lk" href="https://open.spotify.com/user/soitskelley" target="_blank" rel="noopener"><span class="left"><span class="num">04</span>spotify</span><span class="dot-end"></span></a>
        <a class="lk" href="https://airbuds.fm/soitskelley" target="_blank" rel="noopener"><span class="left"><span class="num">05</span>airbuds</span><span class="dot-end"></span></a>

  </main>
</body>
</html>
